<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Havacılık Hukuku, Müşteri İlişkileri Yönetimi ve Lojistik Yönetimi soru bankası ve deneme sınavı">
  <title>SHUİ Soru Bankası</title>
  <script>
    // Tema, sayfa çizilmeden önce uygulanır (yanıp sönmeyi önler)
    try {
      const t = localStorage.getItem('sb_tema');
      document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0F1115">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SHUİ Sınav">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a href="#" class="brand" data-action="home">
        <span class="brand__logo" aria-hidden="true"><i data-lucide="plane"></i></span>
        <span>
          <strong id="app-title">Soru Bankası</strong>
          <small id="app-subtitle"></small>
        </span>
      </a>
      <nav class="nav" aria-label="Ana menü">
        <button class="nav__btn nav__install hidden" data-action="install" id="btn-install"><i data-lucide="download"></i><span class="nav__label">Uygulamayı yükle</span></button>
        <button class="nav__btn" data-action="home"><i data-lucide="layout-grid"></i><span class="nav__label">Ana Sayfa</span></button>
        <button class="nav__btn" data-action="mistakes"><i data-lucide="bookmark-x"></i><span class="nav__label">Yanlışlarım</span> <span class="badge" id="mistake-count">0</span></button>
        <button class="icon-btn" data-action="theme" aria-label="Temayı değiştir" title="Temayı değiştir"><i data-lucide="moon" id="theme-icon"></i></button>
      </nav>
    </div>
  </header>

  <main id="app" class="container" aria-live="polite">
    <p class="muted center">Sorular yükleniyor…</p>
  </main>

  <!-- ANA EKRAN -->
  <template id="tpl-home">
    <section class="grid-2 fade-in">
      <form class="card setup" id="setup-form">
        <div>
          <h1 class="h1">Yeni test oluştur</h1>
          <p class="lead" id="home-lead"></p>
        </div>

        <label class="field">
          <span>Kategori</span>
          <div class="select-wrap"><select id="f-kategori"></select></div>
        </label>

        <label class="field">
          <span>Konu</span>
          <div class="select-wrap"><select id="f-konu"></select></div>
        </label>

        <fieldset class="field">
          <legend>Soru sayısı</legend>
          <div class="segmented" id="f-sayi">
            <label><input type="radio" name="sayi" value="5"><span>5</span></label>
            <label><input type="radio" name="sayi" value="10" checked><span>10</span></label>
            <label><input type="radio" name="sayi" value="20"><span>20</span></label>
            <label><input type="radio" name="sayi" value="0"><span>Tümü</span></label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>Mod</legend>
          <div class="segmented segmented--wide">
            <label><input type="radio" name="mod" value="calisma" checked><span><i data-lucide="book-open"></i>Çalışma</span></label>
            <label><input type="radio" name="mod" value="sinav"><span><i data-lucide="timer"></i>Sınav</span></label>
          </div>
          <small class="muted" id="mod-info"></small>
        </fieldset>

        <div class="toggles">
          <label class="switch"><input type="checkbox" id="f-karistir-soru" checked><span class="switch__track"></span>Soruları karıştır</label>
          <label class="switch"><input type="checkbox" id="f-karistir-sik"><span class="switch__track"></span>Şıkları karıştır</label>
        </div>

        <p class="muted small" id="f-ozet" style="margin:0"></p>
        <div class="stack" style="gap:10px">
          <button type="submit" class="btn btn--primary btn--block"><i data-lucide="play"></i>Teste Başla</button>
          <button type="button" class="btn btn--ghost btn--block" data-action="mistake-test" id="btn-mistake-test"><i data-lucide="rotate-ccw"></i><span>Sadece yanlışlarımdan test</span></button>
        </div>
      </form>

      <aside class="stack">
        <div class="card">
          <h2 class="h2"><i data-lucide="activity"></i>İstatistiklerim</h2>
          <div class="stats" id="stats"></div>
        </div>
        <div class="card">
          <h2 class="h2"><i data-lucide="target"></i>Kategoriye göre hakimiyet</h2>
          <div id="cat-stats" class="bars"></div>
        </div>
        <div class="card">
          <h2 class="h2"><i data-lucide="history"></i>Son testler</h2>
          <ul id="history" class="history"></ul>
        </div>
      </aside>
    </section>
  </template>

  <!-- SORU EKRANI -->
  <template id="tpl-quiz">
    <section class="quiz">
      <div class="quiz__bar card">
        <button class="btn btn--ghost btn--sm" data-action="quit"><i data-lucide="x"></i><span>Çık</span></button>
        <span class="quiz__count" id="q-count"></span>
        <span class="timer hidden" id="q-timer" role="timer"><i data-lucide="timer"></i><span id="q-timer-text"></span></span>
      </div>
      <div class="progress" aria-hidden="true"><i id="q-progress"></i></div>

      <article class="card question" id="q-card">
        <p class="question__meta" id="q-meta"></p>
        <h2 class="question__text" id="q-text"></h2>
        <figure class="question__img hidden" id="q-img"><img alt="Soru görseli" loading="lazy"></figure>
        <div class="options" id="q-options" role="radiogroup"></div>
        <div class="explain hidden" id="q-explain"></div>
      </article>

      <div class="quiz__nav">
        <button class="btn btn--ghost" data-action="prev"><i data-lucide="arrow-left"></i>Önceki</button>
        <button class="btn btn--primary" data-action="next" id="btn-next"></button>
      </div>

      <div class="card palette hidden" id="q-palette">
        <p class="muted small" style="margin:0">Soru haritası</p>
        <div class="palette__grid" id="palette-grid"></div>
      </div>
      <p class="muted center small">A–E veya 1–5 şık seçer · Enter / → sonraki · ← önceki</p>
    </section>
  </template>

  <!-- KARNE -->
  <template id="tpl-result">
    <section class="stack fade-in">
      <div class="card result">
        <h1 class="h1">Sınav Karnesi</h1>
        <p class="lead" id="r-label" style="margin:0"></p>
        <div class="result__score">
          <div class="ring" id="r-ring"><span id="r-pct"></span></div>
          <div class="result__grid">
            <div class="kpi kpi--ok"><b id="r-dogru"></b><span>Doğru</span></div>
            <div class="kpi kpi--bad"><b id="r-yanlis"></b><span>Yanlış</span></div>
            <div class="kpi"><b id="r-bos"></b><span>Boş</span></div>
            <div class="kpi"><b id="r-sure"></b><span>Süre</span></div>
          </div>
        </div>
        <div class="row">
          <button class="btn btn--primary" data-action="retry-wrong" id="btn-retry"><i data-lucide="rotate-ccw"></i><span>Hatalı Soruları Tekrar Çöz</span></button>
          <button class="btn btn--ghost" data-action="home"><i data-lucide="layout-grid"></i>Ana Sayfa</button>
        </div>
      </div>
      <div class="card">
        <h2 class="h2"><i data-lucide="list-checks"></i>Soru soru inceleme</h2>
        <div id="review" class="review"></div>
      </div>
    </section>
  </template>

  <!-- YANLIŞLARIM -->
  <template id="tpl-mistakes">
    <section class="card fade-in">
      <div class="row row--between">
        <div>
          <h1 class="h1">Yanlışlarım</h1>
          <p class="muted" style="margin:0">Bir soruyu doğru çözdüğünde bu listeden düşer.</p>
        </div>
        <div class="row">
          <button class="btn btn--primary" data-action="mistake-test"><i data-lucide="play"></i>Yanlışlardan test</button>
          <button class="btn btn--ghost" data-action="clear-mistakes" id="btn-clear"><i data-lucide="trash-2"></i><span>Listeyi temizle</span></button>
        </div>
      </div>
      <div id="mistake-list" class="review"></div>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
