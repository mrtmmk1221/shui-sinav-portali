name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'final-seferi/**'
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Web dosyalarını hazırla
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          node prepare-www.js
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#4F46E5' --splashBackgroundColor '#FFFFFF' --splashBackgroundColorDark '#111827'
          npx cap sync android

      - name: Sürüm numarası ve imza anahtarı
        working-directory: mobile
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore

      - name: APK derle
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../SHUI-Akademi.apk

      - name: Yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: SHUİ Akademi Android 1.${{ github.run_number }}
          body: |
            Telefona kurmak için **SHUI-Akademi.apk** dosyasını indir ve aç.
            İlk kurulumda "bilinmeyen kaynaklardan yükleme" iznini vermen gerekir.
          files: SHUI-Akademi.apk
          make_latest: true
