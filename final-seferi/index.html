<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHUİ Akademi</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SHUİ Akademi">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@1.57.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#F4F6FB;--bg2:#FFFFFF;--panel:rgba(255,255,255,.82);--panel2:#F1F4F9;--ink:#0F172A;--ink2:#334155;--mute:#64748B;--faint:#94A3B8;
  --line:rgba(15,23,42,.09);--line2:rgba(15,23,42,.16);
  --sky:#0284C7;--indigo:#4F46E5;--amber:#D97706;--grad:linear-gradient(90deg,#0EA5E9,#4F46E5);
  --ok:#059669;--okbg:rgba(16,185,129,.12);--bad:#E11D48;--badbg:rgba(244,63,94,.10);--gold:#D97706;--goldbg:rgba(245,158,11,.12);
  --shadow:0 1px 2px rgba(15,23,42,.05),0 12px 32px rgba(15,23,42,.07);
  --r:24px;--r2:16px;--ease:cubic-bezier(.22,1,.36,1);
  --display:"Plus Jakarta Sans",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0B1120;--bg2:#111827;--panel:rgba(17,24,39,.78);--panel2:#162032;--ink:#F1F5F9;--ink2:#CBD5E1;--mute:#94A3B8;--faint:#64748B;
  --line:rgba(148,163,184,.13);--line2:rgba(148,163,184,.24);
  --sky:#38BDF8;--indigo:#818CF8;--amber:#FBBF24;
  --ok:#34D399;--okbg:rgba(16,185,129,.14);--bad:#FB7185;--badbg:rgba(244,63,94,.13);--gold:#FBBF24;--goldbg:rgba(245,158,11,.13);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.35);color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:clip}
body::before{content:"";position:fixed;inset:-20% -10% auto auto;width:520px;height:520px;border-radius:50%;background:rgba(14,165,233,.10);filter:blur(90px);pointer-events:none;z-index:0}
body::after{content:"";position:fixed;inset:auto auto -20% -10%;width:520px;height:520px;border-radius:50%;background:rgba(99,102,241,.10);filter:blur(90px);pointer-events:none;z-index:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
svg.lucide{width:18px;height:18px;stroke-width:2;flex:none}
.glass{background:var(--panel);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.hide{display:none!important}

/* üst bar */
header{position:sticky;top:0;z-index:30;border-width:0 0 1px;padding-top:env(safe-area-inset-top,0px)}
.hin{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left}
.logo{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(79,70,229,.35)}
.bt{font:800 16px/1.1 var(--display);letter-spacing:-.01em}
.bs{font-size:11px;color:var(--mute);font-weight:500}
.nav{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--panel2);border:1px solid var(--line)}
.nl{border:0;background:none;padding:8px 13px;border-radius:12px;font-size:13px;font-weight:700;color:var(--mute);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .2s,color .2s}
.nl:hover{color:var(--ink)}
.nl.on{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.3)}
.badge{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:999px;background:var(--badbg);color:var(--bad)}
.nl.on .badge{background:rgba(255,255,255,.22);color:#fff}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:12px;font-size:12.5px;font-weight:700;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);white-space:nowrap}
.chip.streak{color:var(--gold);background:var(--goldbg);border-color:rgba(245,158,11,.28)}
.chip.sync.ok{color:var(--ok);background:var(--okbg);border-color:rgba(16,185,129,.28)}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);transition:transform .15s var(--ease)}
.ib:active{transform:scale(.94)}
.mnav{display:none;overflow-x:auto;scrollbar-width:none;padding:0 16px 10px;gap:6px}
.mnav::-webkit-scrollbar{display:none}
.mnav .nl{flex:none}
.bs{white-space:nowrap}
@media (max-width:1180px) and (min-width:1001px){.bs{display:none}}
@media (max-width:1000px){.nav{display:none}.mnav{display:flex}.mnav .nl{background:var(--panel2);border:1px solid var(--line)}.mnav .nl.on{background:var(--grad);border-color:transparent}}
@media (max-width:560px){.bs,.chip.sync span.lbl{display:none}}

main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:24px 16px calc(56px + env(safe-area-inset-bottom,0px))}
.page{animation:fadeIn .45s var(--ease) both}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
h1{font:800 clamp(26px,4.6vw,40px)/1.12 var(--display);letter-spacing:-.025em;margin:0;text-wrap:balance}
h2{font:800 22px/1.2 var(--display);letter-spacing:-.015em;margin:0}
h3{font:700 17px/1.3 var(--display);margin:0}
.mute{color:var(--mute)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.g2,.g3{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:800;background:rgba(14,165,233,.13);color:var(--sky);border:1px solid rgba(14,165,233,.26)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line2);background:var(--panel2);font-weight:700;font-size:14px;transition:transform .15s var(--ease),filter .15s,border-color .15s}
.btn:hover{border-color:var(--sky)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad);color:#fff;border:0;box-shadow:0 8px 22px rgba(79,70,229,.32)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.hero{position:relative;overflow:hidden;padding:30px}
.hero-g{display:grid;grid-template-columns:1.35fr 1fr;gap:28px;align-items:center}
@media (max-width:900px){.hero-g{grid-template-columns:1fr}.hero{padding:22px}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.cd div{border-radius:16px;padding:12px 6px;text-align:center;background:var(--panel2);border:1px solid var(--line)}
.cd b{display:block;font:800 30px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cd span{font-size:11.5px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.date{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);font-weight:600}
.date input{border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:6px 8px;font-size:13px}
.stat{padding:18px;border-radius:20px}
.stat .k{font-size:12px;font-weight:700;color:var(--mute);display:flex;align-items:center;gap:6px}
.stat .v{font:800 28px/1.1 var(--display);margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--faint);margin-top:2px}
.cc{display:flex;flex-direction:column;gap:12px}
.ci{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.ci svg{width:22px;height:22px}
.bar{height:8px;border-radius:8px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:8px;width:0;transition:width .8s var(--ease)}
.c-HH{--c:var(--sky);--cbg:rgba(14,165,233,.14);--cg:linear-gradient(90deg,#38BDF8,#2563EB)}
.c-MIY{--c:var(--indigo);--cbg:rgba(99,102,241,.15);--cg:linear-gradient(90deg,#818CF8,#9333EA)}
.c-LOJ{--c:var(--amber);--cbg:rgba(245,158,11,.15);--cg:linear-gradient(90deg,#FBBF24,#EA580C)}
.ci{background:var(--cbg);color:var(--c)} .bar i{background:var(--cg)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--cbg,var(--panel2));color:var(--c,var(--mute))}
.tag.hot{background:var(--goldbg);color:var(--gold)} .tag.bad{background:var(--badbg);color:var(--bad)}
.tag svg{width:13px;height:13px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:30px 0 14px;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fb{border:1px solid var(--line);background:var(--panel2);padding:8px 13px;border-radius:12px;font-size:13px;font-weight:700;color:var(--mute);transition:all .2s}
.fb.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fb .n{opacity:.6;font-weight:600;margin-left:4px}

/* soru */
.qwrap{max-width:820px;margin:0 auto}
.prog{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width .6s var(--ease)}
.qcard{margin-top:16px}
.qcard.enter{animation:fadeIn .4s var(--ease) both}
.q{font:700 clamp(17px,2.4vw,20px)/1.5 var(--display);margin:14px 0 18px;letter-spacing:-.005em;white-space:pre-line}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;margin:0 0 9px;border:1px solid var(--line2);background:var(--bg2);border-radius:14px;font-size:15.5px;line-height:1.45;transition:transform .18s var(--ease),border-color .18s,background-color .25s,box-shadow .3s}
@media (hover:hover){.opt:not([disabled]):hover{transform:scale(1.01);border-color:var(--sky);box-shadow:0 4px 16px rgba(14,165,233,.12)}}
.opt:not([disabled]):active{transform:scale(.98)}
.opt b{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--panel2);font-size:13px;font-weight:800;color:var(--mute);transition:all .25s}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--indigo);background:rgba(99,102,241,.10)} .opt.sel b{background:var(--indigo);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg);animation:glow .9s var(--ease)} .opt.ok b{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg);animation:shake .42s cubic-bezier(.36,.07,.19,.97)} .opt.bad b{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--okbg)}50%{box-shadow:0 0 0 8px var(--okbg)}100%{box-shadow:0 0 0 3px var(--okbg)}}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
.fbx{margin-top:8px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);animation:fadeIn .35s var(--ease) both}
.fbx.ok{background:var(--okbg);border-color:rgba(16,185,129,.3)} .fbx.bad{background:var(--badbg);border-color:rgba(244,63,94,.3)}
.fbx h4{margin:0 0 4px;font:800 15px var(--display);display:flex;align-items:center;gap:7px}
.fbx.ok h4{color:var(--ok)} .fbx.bad h4{color:var(--bad)}
.fbx p{margin:0;color:var(--ink2);font-size:14.5px}
.qnav{display:flex;gap:10px;margin-top:16px}
.qnav .btn{flex:1}
.star.on{color:var(--gold);background:var(--goldbg);border-color:rgba(245,158,11,.3)}
.star.on svg{fill:currentColor}
.big{font:800 clamp(48px,10vw,68px)/1 var(--display);letter-spacing:-.04em}

/* sınav */
.exam-g{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
@media (max-width:900px){.exam-g{grid-template-columns:1fr}}
.timer{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer.low{color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:12px}
.pal button{height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);font-size:13px;font-weight:700;color:var(--mute);position:relative}
.pal button.ans{background:rgba(99,102,241,.16);color:var(--indigo);border-color:rgba(99,102,241,.4)}
.pal button.cur{outline:2px solid var(--sky);outline-offset:1px}
.pal button.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.pal button.r-ok{background:var(--okbg);color:var(--ok);border-color:rgba(16,185,129,.4)}
.pal button.r-bad{background:var(--badbg);color:var(--bad);border-color:rgba(244,63,94,.4)}
.scope{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:18px;border:1px solid var(--line2);background:var(--bg2);transition:border-color .2s,transform .15s var(--ease)}
.scope:hover{border-color:var(--sky)} .scope.on{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
.scope .ci{width:42px;height:42px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.rv{padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--bg2);margin-bottom:10px}
.rv .a{font-size:14px;margin-top:6px}
.rv .a .y{color:var(--bad);font-weight:600} .rv .a .c{color:var(--ok);font-weight:700}

/* notlar / kartlar */
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--bg2);border-radius:14px;padding:0 12px;min-height:44px;flex:1 1 240px;max-width:380px}
.search input{border:0;background:none;outline:none;flex:1;font-size:14px;padding:10px 0}
.note h3{margin:8px 0 10px}
.note ul{margin:0;padding-left:18px;color:var(--ink2);font-size:14px;line-height:1.6}
.note li{margin-bottom:6px}
.note li strong{color:var(--ink)}
.note code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;padding:1px 6px;border-radius:6px;background:var(--goldbg);color:var(--ink)}
.flip{perspective:1400px;max-width:720px;margin:16px auto 0;cursor:pointer}
.flip-in{display:grid;min-height:300px;transition:transform .6s var(--ease);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;position:relative;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);padding:26px;display:flex;flex-direction:column;justify-content:center;gap:12px;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg)}
.face .q{margin:0}
.fc-ans{font:800 21px/1.35 var(--display);color:var(--ok)}
.mrow{padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--bg2);display:flex;gap:12px;align-items:flex-start}
.mrow .body{flex:1}
.mrow .qt{font-weight:600;line-height:1.45}
.mrow .ans{margin-top:6px;font-size:14px;color:var(--ok);font-weight:700}
.mrow details{margin-top:6px;font-size:13.5px;color:var(--ink2)}
.mrow summary{cursor:pointer;color:var(--mute);font-weight:600}
.empty{text-align:center;padding:48px 20px}
.empty .ci{margin:0 auto 12px;width:56px;height:56px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(2,6,23,.55);display:grid;place-items:center;padding:16px;animation:fadeIn .2s ease both}
.modal .card{max-width:440px;width:100%}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);resize:vertical}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;font-size:13.5px;box-shadow:var(--shadow);animation:fadeIn .25s ease both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="glass">
  <div class="hin">
    <button class="brand" data-go="home"><span class="logo"><i data-lucide="plane"></i></span><span><div class="bt">SHUİ Akademi</div><div class="bs">Sivil Hava Ulaştırma İşletmeciliği</div></span></button>
    <div class="sp"></div>
    <nav class="nav" id="nav"></nav>
    <div class="sp"></div>
    <span class="chip sync" id="sync" title="İlerleme durumu"><i data-lucide="cloud-off"></i><span class="lbl">Bu cihazda</span></span>
    <span class="chip streak" title="Kesintisiz doğru serisi"><i data-lucide="flame"></i><span id="streak">0</span></span>
    <button class="ib" id="theme" aria-label="Tema değiştir"><i data-lucide="sun"></i></button>
  </div>
  <nav class="mnav" id="mnav"></nav>
</header>
<main id="app"><p class="mute">Yükleniyor…</p></main>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
{
// ===================== VERİ =====================
const CN={HH:'Havacılık Hukuku',MIY:'Müşteri İlişkileri Yönetimi',LOJ:'Lojistik Yönetimi'};
const CS={HH:'Havacılık Hukuku',MIY:'Müşteri İlişkileri',LOJ:'Lojistik Yönetimi'};
const CI={HH:'scale',MIY:'users',LOJ:'package'};
const CD={HH:'Şikago, Varşova ve Montreal konvansiyonları, hava trafik hakları, 2920 sayılı TSHK, SHGM/DHMİ, lisanslar ve işletme yetkilendirme.',
 MIY:'Operasyonel/analitik/işbirlikçi MİY, müşteri değeri ve CLV, RFM, cüzdan payı, müşteri kazanma, elde tutma ve veri madenciliği.',
 LOJ:'Talep tahmini (MAD, RSFE, izleme sinyali), ESM ve iskonto modelleri, stok türleri, ABC analizi, depo türleri ve taşımacılık.'};
const NOTES=[
 {c:'HH',tag:'Temel mevzuat ve kurumlar',title:'2920 sayılı TSHK, SHGM ve DHMİ',pts:[
  '<strong>2920 sayılı Türk Sivil Havacılık Kanunu</strong> 14.10.1983’te yürürlüğe girdi; 7 kısım ve 150 maddeden oluşur. Türk sivil havacılığının serbestleşmesinin temelini attı.',
  '<strong>SHGM:</strong> Türk sivil hava araçlarının sicilini tutar, lisans ve ruhsatları verir, azami kalkış ağırlığı <strong>500 gram ve üzeri</strong> İHA’ların kayıt sistemini kurar. 2005’te <strong>5431 sayılı kanunla</strong> özerk yapıya kavuştu.',
  '<strong>DHMİ:</strong> Havalimanlarını işletir, hava trafik ve seyrüsefer hizmeti verir; yüksek maliyetli yatırımları <strong>Yap-İşlet-Devret</strong> modeliyle özel sektöre yaptırır.',

 const tot=Q.filter(q=>!c||q.c===c).length;return {solved:ids.length,tot,acc:n?Math.round(k/n*100):0,n,k}}

function record(q,ok){
 const s=S.ans[q.id]||(S.ans[q.id]={n:0,c:0,last:'',ok:false});s.n++;if(ok)s.c++;s.last=today();s.ok=ok;
 const w=S.wrong[q.id];
 if(ok){if(w){w.ok=(w.ok||0)+1;if(w.ok>=2)delete S.wrong[q.id]}S.streak++;S.best=Math.max(S.best,S.streak)}
 else{S.wrong[q.id]={since:w?w.since:today(),ok:0};S.streak=0}
 S.daily[today()]=(S.daily[today()]||0)+1;
}

let FC={c:'all',deck:[],i:0};
function cardsPage(){FC.deck=shuffle(Q.filter(q=>(FC.c==='all'||q.c===FC.c)&&!S.fc[q.id]&&q.o[q.a].length<160)).sort((a,b)=>(b.x>0)-(a.x>0)).slice(0,60);FC.i=0;renderCard()}
function renderCard(){const known=Object.keys(S.fc).filter(id=>BY[id]&&(FC.c==='all'||BY[id].c===FC.c)).length;const q=FC.deck[FC.i];
 app.innerHTML=`<div class="page" style="max-width:820px;margin:0 auto"><div class="row" style="justify-content:space-between"><div><h2>Bilgi kartları</h2><p class="mute" style="margin:4px 0 0">Karta dokun, cevabı gör. Bildiklerin desteden çıkar.</p></div><span class="chip"><i data-lucide="brain"></i>${known} biliniyor</span></div>
 <div class="filters" style="margin:14px 0 0">${[['all','Tümü']].concat(Object.keys(CN).map(c=>[c,CS[c]])).map(([k,t])=>`<button class="fb ${FC.c===k?'on':''}" data-fc="${k}">${t}</button>`).join('')}</div>
 ${q?`<div class="row mute" style="justify-content:space-between;margin-top:16px;font-size:13px;font-weight:700"><span>Kart ${FC.i+1} / ${FC.deck.length}</span><span>Boşluk: çevir · ← tekrar · → biliyorum</span></div>
 <div class="flip c-${q.c}" id="flip"><div class="flip-in"><div class="face front glass"><span class="tag" style="align-self:flex-start">${CS[q.c]}</span><p class="q">${esc(q.q.replace(/aşağıdakilerden hangisi(dir)?\??/i,'nedir?'))}</p><span class="mute" style="font-size:13px"><i data-lucide="hand"></i> Cevap için dokun</span></div>
 <div class="face back glass"><span class="tag" style="align-self:flex-start;background:var(--okbg);color:var(--ok)">Cevap</span><div class="fc-ans">${esc(q.o[q.a])}</div>${q.e?`<p class="mute" style="margin:0;font-size:14px">${esc(q.e)}</p>`:''}</div></div></div>
 <div class="qnav" style="max-width:720px;margin:16px auto 0"><button class="btn" id="fagain"><i data-lucide="rotate-ccw"></i>Tekrar et</button><button class="btn pri" id="fknow"><i data-lucide="check"></i>Biliyorum</button></div>`
 :`<div class="card glass empty" style="margin-top:16px"><span class="ci" style="background:var(--okbg);color:var(--ok)"><i data-lucide="party-popper"></i></span><h3>Deste bitti</h3><p class="mute">Bu desteyi tamamladın.</p><div class="row" style="justify-content:center"><button class="btn pri" id="fre"><i data-lucide="shuffle"></i>Yeni deste</button>${known?'<button class="btn" id="fclr"><i data-lucide="rotate-ccw"></i>Bilinenleri geri al</button>':''}</div></div>`}</div>`;
 icons();document.querySelectorAll('[data-fc]').forEach(b=>b.onclick=()=>{FC.c=b.dataset.fc;cardsPage()});
 if(q){$('#flip').onclick=()=>$('#flip').classList.toggle('on');$('#fknow').onclick=()=>{S.fc[q.id]=1;save();FC.i++;renderCard()};$('#fagain').onclick=()=>{FC.deck.push(FC.deck.splice(FC.i,1)[0]);renderCard()}}
 else{$('#fre').onclick=cardsPage;const c=$('#fclr');if(c)c.onclick=()=>{Object.keys(S.fc).forEach(id=>{if(BY[id]&&(FC.c==='all'||BY[id].c===FC.c))delete S.fc[id]});save();cardsPage()}}}

// ===================== YANLIŞLARIM =====================
let WF='all';
function wrongPage(){const ids=Object.keys(S.wrong).filter(id=>BY[id]&&(WF==='all'||BY[id].c===WF)).sort((a,b)=>S.wrong[b].since.localeCompare(S.wrong[a].since));
 app.innerHTML=`<div class="page" style="max-width:900px;margin:0 auto"><div class="row" style="justify-content:space-between"><div><h2>Yanlışlarım</h2><p class="mute" style="margin:4px 0 0">Yanlış yaptığın sorular burada birikir; iki kez doğru yapınca listeden çıkar.</p></div>
 <button class="btn pri" id="wgo" ${ids.length?'':'disabled'}><i data-lucide="play"></i>Yanlışları çöz (${Math.min(ids.length,20)})</button></div>
 <div class="filters" style="margin:14px 0 16px">${[['all','Tümü']].concat(Object.keys(CN).map(c=>[c,CS[c]])).map(([k,t])=>`<button class="fb ${WF===k?'on':''}" data-wf="${k}">${t}<span class="n">${wrongCount(k==='all'?null:k)}</span></button>`).join('')}</div>
 ${ids.length?`<div class="grid" style="gap:10px">${ids.map(id=>{const q=BY[id],w=S.wrong[id];return `<div class="mrow c-${q.c}"><div class="body"><div class="row" style="gap:6px;margin-bottom:6px"><span class="tag">${CS[q.c]}</span>${w.ok?`<span class="tag" style="background:var(--okbg);color:var(--ok)">1/2 doğru</span>`:''}</div><div class="qt">${esc(q.q)}</div><div class="ans">✓ ${esc(q.o[q.a])}</div>${q.e?`<details><summary>Açıklama</summary>${esc(q.e)}</details>`:''}</div><button class="ib" data-rm="${id}" aria-label="Listeden çıkar" title="Listeden çıkar"><i data-lucide="x"></i></button></div>`}).join('')}</div>`
 :`<div class="card glass empty"><span class="ci" style="background:var(--okbg);color:var(--ok)"><i data-lucide="sparkles"></i></span><h3>Yanlış listen boş</h3><p class="mute">Test çözdükçe yanlış yaptığın sorular burada toplanır.</p><button class="btn pri" data-go="quiz"><i data-lucide="play"></i>Test çöz</button></div>`}</div>`;
 icons();document.querySelectorAll('[data-wf]').forEach(b=>b.onclick=()=>{WF=b.dataset.wf;wrongPage()});
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{delete S.wrong[b.dataset.rm];save();renderNav();wrongPage()});
 const g=$('#wgo');if(g)g.onclick=()=>{QF.c=WF;QF.m='wrong';go('quiz')}}

// ===================== EFEKT =====================
const fx=$('#fx'),fctx=fx.getContext('2d');let parts=[],fxRun=false;
function confetti(x,y){if(reduced())return;const dpr=devicePixelRatio||1;fx.width=innerWidth*dpr;fx.height=innerHeight*dpr;fctx.setTransform(dpr,0,0,dpr,0,0);
 const cols=['#34D399','#38BDF8','#818CF8','#FBBF24'];
 for(let i=0;i<34;i++){const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.1,v=4+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:2+Math.random()*3,c:cols[i%4],life:1,rot:Math.random()*6})}
 if(!fxRun){fxRun=true;requestAnimationFrame(ft)}}
function ft(){fctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.life>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.vx*=.985;p.life-=.018;p.rot+=.15;fctx.globalAlpha=Math.max(0,p.life);fctx.fillStyle=p.c;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.rot);fctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);fctx.restore()});fctx.globalAlpha=1;if(parts.length)requestAnimationFrame(ft);else fxRun=false}

// ===================== KLAVYE =====================
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;
 if(PAGE==='quiz'&&QZ&&!QZ.done){const btn=[...document.querySelectorAll('.opt')];const k='12345'.indexOf(e.key)>=0?'12345'.indexOf(e.key):'abcde'.indexOf((e.key||'').toLowerCase());
  if(k>=0&&k<btn.length&&!btn[k].disabled)btn[k].click();else if(e.key==='ArrowRight'||e.key==='Enter'){const n=$('#qnext');if(n)n.click()}else if(e.key==='ArrowLeft'){const p=$('#qprev');if(p&&!p.disabled)p.click()}}
 else if(PAGE==='cards'){if(e.key===' '){e.preventDefault();const f=$('#flip');if(f)f.classList.toggle('on')}else if(e.key==='ArrowRight'){const b=$('#fknow');if(b)b.click()}else if(e.key==='ArrowLeft'){const b=$('#fagain');if(b)b.click()}}
 else if(PAGE==='exam'&&EX&&EX.running){const btn=[...document.querySelectorAll('.opt')];const k='12345'.indexOf(e.key);if(k>=0&&k<btn.length)btn[k].click();else if(e.key==='ArrowRight'){$('#exn').click()}else if(e.key==='ArrowLeft'){const p=$('#exp');if(p&&!p.disabled)p.click()}}});

// ===================== AÇILIŞ =====================
function refreshView(){renderNav();if(PAGE==='home')home();else if(PAGE==='wrong')wrongPage()}
async function boot(){
 S=loadLocal();renderNav();
 try{const r=await fetch('questions.json');Q=await r.json()}catch(e){app.innerHTML='<p class="mute">Sorular yüklenemedi. Sayfayı yenile.</p>';return}
 Q.forEach(q=>BY[q.id]=q);Object.keys(S.wrong).forEach(id=>{if(!BY[id])delete S.wrong[id]});
 go('home');
 try{
  const cl=window.claude;if(!cl||!cl.use)return;
  const [d,u]=await Promise.all([cl.use('db'),cl.use('user')]);if(!d||!u)return;
  const id=await u.id();if(!id)return;db=d;uid=id;
  const pref=db.collection('data/users/'+uid).doc('portal');
  // eski Final Seferi kaydını bir kez taşı
  const snap=await pref.get();
  if(snap.exists){const v=snap.data();const rem=JSON.parse(v.state||'{}');if((v.at||0)>=S.at||!Object.keys(S.ans).length){adopt(rem)}else{dirty=true}}
  else{const old=await db.collection('data/users/'+uid).doc('progress').get();
   if(old.exists&&!Object.keys(S.ans).length){try{const o=JSON.parse(old.data().state||'{}');Object.entries(o.seen||{}).forEach(([k,v])=>{S.ans[k]={n:v.n||0,c:v.c||0,last:v.last||'',ok:(v.c||0)>0}});Object.entries(o.cursed||{}).forEach(([k,v])=>{S.wrong[k]={since:v.since||today(),ok:0}})}catch(e){}}
   dirty=true}
  ref=pref;syncChip();if(dirty){S.at=Date.now();push()}
  if(!QZ&&!(EX&&EX.running))refreshView();
  // diğer cihazdan gelen değişiklikleri canlı al
  ref.onSnapshot(sn=>{if(!sn.exists)return;const v=sn.data();if(v.dev===DEV||(v.at||0)<=S.at)return;
   adopt(JSON.parse(v.state||'{}'));syncChip();if(!(PAGE==='quiz'&&QZ&&!QZ.done)&&!(EX&&EX.running)&&PAGE!=='cards')refreshView();else renderNav()},()=>{});
 }catch(e){}
}
boot();
if('serviceWorker' in navigator && !/claude/.test(location.hostname)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
}
</script>
